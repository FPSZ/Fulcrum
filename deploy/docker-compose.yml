# 枢衡 Fulcrum · 单容器一键部署
# 一条命令(在仓库根目录执行):
#     docker compose -f deploy/docker-compose.yml up -d --build
# 浏览器打开 http://localhost:8000 即为控制台;API 同端口。
#
# 本编排**只起生产服务**(控制台前端 + 安全网关/管控 API,同一进程)。
# 被保护方企业智能体(:8800)、政务沙盘 demo 等测试靶机**不在此编排内** —— 它们是
# 联调/演示用的"客户侧智能体"模拟,生产部署由客户自己的智能体充当上游,不随镜像分发。

services:
  fulcrum:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fulcrum:latest
    container_name: fulcrum
    # 机密/配置只走 .env(复制 .env.example → .env 后按需改);绝不写进镜像
    env_file:
      - path: ../.env
        required: false
    # 容器内固定对外可达 + 指向镜像内已构建的前端;显式重申以覆盖 .env 里的本机值
    environment:
      FULCRUM_HOST: 0.0.0.0
      FULCRUM_FRONTEND_DIR: /app/console/dist
    ports:
      - "8000:8000"
    # 运行产物持久化(SQLite 审计库/鉴权库、网关接入配置等),容器重建数据不丢
    volumes:
      - fulcrum-data:/app/data/runtime
    restart: unless-stopped

volumes:
  fulcrum-data:
