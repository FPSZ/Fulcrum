name: deploy

# 推送到 main 即自动部署到生产服务器(fulcrum.makerealm.top)。
# 前端在 CI 里用 vite 构建(不走 tsc 闸门),再 rsync 源码+dist 到服务器并重启 systemd。
# 需要仓库 Secrets:DEPLOY_HOST、DEPLOY_SSH_KEY(ed25519 私钥)。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build frontend (vite, 不经 tsc 闸门)
        working-directory: console
        run: |
          npm ci
          npx vite build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server
        env:
          H: root@${{ secrets.DEPLOY_HOST }}
        run: |
          # src 用 --delete(限定在 src 目录内,安全);单文件直传;dist 整目录替换。
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='__pycache__' --exclude='*.pyc' \
            src/ "$H:/opt/fulcrum/src/"
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            pyproject.toml uv.lock README.md "$H:/opt/fulcrum/"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            console/dist/ "$H:/opt/fulcrum/console/dist/"
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            data/policies/ "$H:/opt/fulcrum/data/policies/"

      - name: Sync deps & restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.DEPLOY_HOST }} bash -se <<'REMOTE'
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd /opt/fulcrum
          uv sync --python 3.11
          systemctl restart fulcrum

          # 健康门:重启后应用要重新导入整个管线(FastAPI + 全部检测器 + 策略),
          # uv sync 重建包后还是冷启动,固定 sleep 3 会在绑端口前就判死刑
          # (2026-09-09 部署即因此失败:is-active=active 但 healthz:000)。
          # 改为轮询,最多等 60s,任一次 200 即通过。
          code=000
          for i in $(seq 1 30); do
            # curl 连不上时 -w 本身就会输出 000 且退出码非零,故只吞退出码、不再补写,
            # 否则 code 会被拼成 000000,失败信息里的状态码就是错的。
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/healthz || true)
            [ -n "$code" ] || code=000
            if [ "$code" = "200" ]; then
              echo "healthz:200(第 ${i} 次探测,约 $((i * 2))s)"
              systemctl is-active fulcrum
              exit 0
            fi
            sleep 2
          done

          # 失败时把现场打出来,否则日志里只有一个 exit code,无从判断。
          echo "::error::healthz 60s 内未就绪,最后一次 HTTP code=${code}" >&2
          systemctl is-active fulcrum || true
          echo "----- systemctl status -----" >&2
          systemctl status fulcrum --no-pager -l | tail -n 30 >&2
          echo "----- journalctl(最近 80 行)-----" >&2
          journalctl -u fulcrum -n 80 --no-pager >&2
          exit 1
          REMOTE
