# 政务大厅智能助手 · 演示策略 —— 条件 → 分级处置(allow/sanitize/approve/block)。
# 规则自上而下,首条命中即决定。配合 demo 业务工具:
#   doc.read / kb.search / case.approve / funds.disburse / citizen.query / external.send / shell.exec / notify.send
version: 1
default: allow
workspace: data/gov_workspace
allow_domains:
  - gov.cn
  - xiongan.gov.cn

rules:
  # 0a) 任务链:敏感数据读取 → 对外发送 —— 数据外泄链,直接阻断。
  #     单步可能各自合规(查个人办件、向白名单域发送),组合顺序才是外泄,故由链风险判定。
  - id: block-exfil-chain
    when:
      chain_risk_at_least: 0.8
    decision: block
    risk_level: critical
    reason: 检测到「敏感数据读取 → 对外发送」异常动作链,疑似数据外泄

  # 0b) 任务链:一般读取 → 对外发送 —— 转人工复核。
  - id: approve-readsend-chain
    when:
      chain_risk_at_least: 0.4
    decision: approve
    risk_level: high
    reason: 检测到「读取 → 对外发送」动作链,须人工复核

  # 1) 读取机密资料(confidential/ 目录或含密钥凭据)—— 直接阻断。
  - id: block-confidential-doc
    when:
      tool_in: [doc.read, file.read]
      path_sensitive: true
    decision: block
    risk_level: critical
    reason: 该资料为机密级,禁止智能体读取

  # 2) 资料访问越出受控资料区 —— 阻断。
  - id: block-doc-escape
    when:
      tool_in: [doc.read, file.read, file.write]
      path_outside_workspace: true
    decision: block
    risk_level: high
    reason: 文件路径越出受控资料区

  # 2b) 破坏性批量删除(通配 / 递归)—— 不可逆,直接阻断(如批量删审批记录)。
  - id: block-destructive
    when:
      tool_in: [file.delete, doc.delete]
      destructive_action: true
    decision: block
    risk_level: critical
    reason: 通配或递归批量删除不可逆,禁止智能体执行

  # 3) 不可信来源(群众来信/外部文档等)驱动的高危动作 —— 阻断(间接注入主防线)。
  - id: block-untrusted-highrisk
    when:
      source_trust: untrusted
      risk_at_least: 0.6
    decision: block
    risk_level: high
    reason: 不可信来源驱动的高危业务动作(疑似间接指令注入)

  # 4) 向非白名单地址外发数据 —— 阻断(防数据外泄)。
  - id: block-external-exfil
    when:
      tool_in: [external.send]
      domain_allowed: false
    decision: block
    risk_level: critical
    reason: 目标地址不在外联白名单,疑似数据外泄

  # 4b) http.request 打内网/回环/云元数据(SSRF)—— 直接阻断(借智能体探内部面、窃实例凭据)。
  #     url_is_internal 覆盖字面内网 IP / localhost / 169.254 元数据 / 进制混淆 IP(配合 argrisk P3)。
  - id: block-ssrf-internal
    when:
      tool_in: [http.request]
      url_is_internal: true
    decision: block
    risk_level: critical
    reason: 外联目标为内网/回环/云元数据地址,疑似 SSRF

  # 4c) http.request 外联非白名单域名 —— 阻断(裸 IP / 混淆 IP / 攻击者域名均不在白名单)。
  - id: block-nonwhitelist-domain
    when:
      tool_in: [http.request]
      domain_allowed: false
    decision: block
    risk_level: high
    reason: 目标域名不在外联白名单内

  # 4d) 任意对外工具(notify.send/webhook…)外联非白名单公网域名 —— 阻断(外泄不只走上面两类)。
  #      dest_is_url 形态围栏排除把 target/dest 当非 URL 字段用的工具误伤;内网情形由 4b 兜住。
  - id: block-nonwhitelist-domain-any-tool
    when:
      dest_is_url: true
      domain_allowed: false
    decision: block
    risk_level: high
    reason: 对外工具的目标域名不在外联白名单内,疑似数据外泄(非 http 出口)

  # 5) 危险系统命令 —— 阻断。
  - id: block-dangerous-command
    when:
      tool_in: [shell.exec]
      command_dangerous: true
    decision: block
    risk_level: critical
    reason: 命令包含高危操作

  # 6) 发放资金 —— 涉及财政资金,一律转人工审批。
  - id: approve-funds
    when:
      tool_in: [funds.disburse]
    decision: approve
    risk_level: high
    reason: 发放财政补助资金,须经人工审批

  # 7) 审批办件 —— 关键业务决定,转人工审批。
  - id: approve-case
    when:
      tool_in: [case.approve]
    decision: approve
    risk_level: high
    reason: 低保/救助审批为关键业务决定,须经人工复核

  # 8) 运维命令 —— 默认转人工审批。
  - id: approve-shell
    when:
      tool_in: [shell.exec]
    decision: approve
    risk_level: high
    reason: 系统命令默认需人工审批
